<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>활동 1 - '좋아요 흡혈귀'의 가짜 가면 해부하기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Pretendard', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    
    /* 16:9 비율 유지 컨테이너 */
    .aspect-16-9-container {
      width: 100%;
      max-width: 1440px;
      aspect-ratio: 16 / 9;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }

    /* 드로잉 캔버스 관련 */
    #drawing-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      cursor: crosshair;
      touch-action: none; /* 모바일에서 캔버스 터치 시 스크롤 방지 */
    }

    /* SVG 배경 */
    #mask-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none;
    }

    /* 스크롤바 커스텀 (입력창용) */
    textarea::-webkit-scrollbar { width: 6px; }
    textarea::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="p-4 sm:p-8">

  <!-- 전체 16:9 활동지 영역 -->
  <main class="aspect-16-9-container bg-gradient-to-br from-sky-100 via-blue-50 to-white rounded-2xl sm:rounded-[2rem] overflow-hidden flex flex-col md:flex-row border border-sky-200">
    
    <!-- 왼쪽: 활동 설명 및 질문 입력 영역 -->
    <div class="w-full md:w-5/12 h-full p-8 md:p-12 flex flex-col justify-start border-r border-sky-200/60 overflow-y-auto">
      
      <!-- 헤더 -->
      <div class="mb-6">
        <h2 class="text-3xl md:text-4xl font-black text-slate-800 tracking-tight flex flex-col gap-2">
          <span class="text-xl md:text-2xl text-sky-600 font-bold">활동 1</span>
          '좋아요 흡혈귀'의 가짜 가면 해부하기
        </h2>
        <p class="mt-4 text-slate-700 font-medium leading-relaxed break-keep">
          최근 일주일 동안 디지털 기기를 사용하면서 기분이 가라앉거나 자존감이 떨어졌던 경험을 떠올려 봅니다. 아래 질문에 솔직하게 답한 후 우측 가면에 색칠해보세요.
        </p>
      </div>

      <!-- 질문 리스트 -->
      <div class="flex flex-col gap-4 flex-1">
        <!-- Q1 -->
        <div class="flex flex-col gap-1.5">
          <label class="font-bold text-slate-800 text-sm md:text-base flex gap-1.5">
            <span class="text-sky-500">①</span> 언제 그랬나요?
          </label>
          <input type="text" placeholder="(예: 학원 끝나고 밤에 침대에 누웠을 때)" class="w-full bg-white/60 border border-sky-200 focus:border-sky-400 focus:ring-2 focus:ring-sky-200 outline-none rounded-xl px-4 py-2.5 text-sm transition-all shadow-sm">
        </div>

        <!-- Q2 -->
        <div class="flex flex-col gap-1.5">
          <label class="font-bold text-slate-800 text-sm md:text-base flex gap-1.5">
            <span class="text-sky-500">②</span> 어떤 어플(앱)이었나요?
          </label>
          <input type="text" placeholder="(예: 인스타그램 릴스, 친구 부계정 스토리)" class="w-full bg-white/60 border border-sky-200 focus:border-sky-400 focus:ring-2 focus:ring-sky-200 outline-none rounded-xl px-4 py-2.5 text-sm transition-all shadow-sm">
        </div>

        <!-- Q3 -->
        <div class="flex flex-col gap-1.5">
          <label class="font-bold text-slate-800 text-sm md:text-base flex gap-1.5 break-keep">
            <span class="text-sky-500">③</span> 어떤 댓글이나 피드백, 혹은 영상 때문이었나요?
          </label>
          <textarea rows="2" placeholder="(예: 나만 빼고 재미있게 놀았다는 단톡방 대화 / 친구의 화려한 생일파티 사진과 수많은 하트 개수)" class="w-full bg-white/60 border border-sky-200 focus:border-sky-400 focus:ring-2 focus:ring-sky-200 outline-none rounded-xl px-4 py-2.5 text-sm transition-all shadow-sm resize-none"></textarea>
        </div>

        <!-- Q4 -->
        <div class="flex flex-col gap-1.5 h-full">
          <label class="font-bold text-slate-800 text-sm md:text-base flex gap-1.5 break-keep">
            <span class="text-sky-500">④</span> 내가 온라인 공간에서 무심코 마주한 반응이 내 현실의 기분을 어떻게 흔들어 놓았나요?
          </label>
          <textarea placeholder="솔직한 나의 감정과 기분을 적어보세요." class="w-full h-full min-h-[80px] bg-white/60 border border-sky-200 focus:border-sky-400 focus:ring-2 focus:ring-sky-200 outline-none rounded-xl px-4 py-2.5 text-sm transition-all shadow-sm resize-none"></textarea>
        </div>
      </div>
    </div>

    <!-- 오른쪽: 인터랙티브 드로잉 가면 영역 -->
    <div class="w-full md:w-7/12 h-full flex flex-col relative bg-white">
      
      <!-- 상단 툴바 -->
      <div class="absolute top-4 left-0 w-full px-6 z-20 flex justify-between items-center pointer-events-none">
        <!-- 색상 팔레트 -->
        <div class="bg-white/90 backdrop-blur-sm border border-slate-200 shadow-md rounded-2xl p-2 flex gap-1.5 pointer-events-auto items-center">
          <div class="text-xs font-bold text-slate-400 mr-1 px-1">색상</div>
          <!-- 화려한 색상 (왼쪽용) -->
          <button class="color-btn w-6 h-6 rounded-full bg-[#fca5a5] ring-2 ring-offset-1 ring-slate-300 transition-transform hover:scale-110 active" data-color="#fca5a5" title="화사한 핑크"></button>
          <button class="color-btn w-6 h-6 rounded-full bg-[#fde047] hover:scale-110 transition-transform" data-color="#fde047" title="밝은 노랑"></button>
          <button class="color-btn w-6 h-6 rounded-full bg-[#60a5fa] hover:scale-110 transition-transform" data-color="#60a5fa" title="시원한 파랑"></button>
          <button class="color-btn w-6 h-6 rounded-full bg-[#34d399] hover:scale-110 transition-transform" data-color="#34d399" title="선명한 초록"></button>
          <div class="w-px h-5 bg-slate-300 mx-1"></div>
          <!-- 어두운 상처 색상 (오른쪽용) -->
          <button class="color-btn w-6 h-6 rounded-full bg-[#475569] hover:scale-110 transition-transform" data-color="#475569" title="탁한 회색"></button>
          <button class="color-btn w-6 h-6 rounded-full bg-[#312e81] hover:scale-110 transition-transform" data-color="#312e81" title="멍든 남색"></button>
          <button class="color-btn w-6 h-6 rounded-full bg-[#581c87] hover:scale-110 transition-transform" data-color="#581c87" title="상처난 보라"></button>
          <button class="color-btn w-6 h-6 rounded-full bg-[#000000] hover:scale-110 transition-transform" data-color="#000000" title="검정"></button>
        </div>

        <!-- 펜 & 지우개 & 초기화 도구 -->
        <div class="bg-white/90 backdrop-blur-sm border border-slate-200 shadow-md rounded-2xl p-2 flex gap-3 pointer-events-auto items-center">
          <div class="flex items-center gap-2 border-r pr-3">
            <i class="ph-bold ph-pencil-simple text-slate-500"></i>
            <input type="range" id="brush-size" min="1" max="20" value="5" class="w-20 accent-sky-500">
          </div>
          <button id="eraser-btn" class="flex items-center gap-1 px-2 py-1 rounded-lg text-sm font-bold text-slate-600 hover:bg-slate-100 transition-colors">
            <i class="ph-bold ph-eraser"></i> 지우개
          </button>
          <button id="clear-btn" class="flex items-center gap-1 px-2 py-1 rounded-lg text-sm font-bold text-rose-500 hover:bg-rose-50 transition-colors">
            <i class="ph-bold ph-trash"></i> 전체 지우기
          </button>
        </div>
      </div>

      <!-- 캔버스 및 배경 래퍼 -->
      <div class="relative w-full flex-1 overflow-hidden flex items-center justify-center pt-16 pb-24">
        
        <!-- 중앙 정렬을 위한 이너 컨테이너 -->
        <div class="relative w-[90%] max-w-[700px] aspect-[4/3]" id="canvas-container">
          
          <!-- 배경 SVG (점선 가면) -->
          <svg id="mask-svg" viewBox="0 0 500 400" preserveAspectRatio="xMidYMid meet">
            <!-- 중앙 점선 -->
            <line x1="250" y1="20" x2="250" y2="380" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,6"/>
            
            <!-- 얼굴 윤곽선 (좌/우) -->
            <path d="M 250 40 C 380 40, 420 180, 380 290 C 350 370, 250 380, 250 380 C 250 380, 150 370, 120 290 C 80 180, 120 40, 250 40 Z" fill="none" stroke="#cbd5e1" stroke-width="3"/>
            
            <!-- 귀 윤곽선 -->
            <path d="M 125 180 C 100 170, 90 220, 110 240" fill="none" stroke="#cbd5e1" stroke-width="3"/>
            <path d="M 375 180 C 400 170, 410 220, 390 240" fill="none" stroke="#cbd5e1" stroke-width="3"/>

            <!-- 눈 위치 가이드 (점선) -->
            <ellipse cx="180" cy="180" rx="25" ry="12" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4"/>
            <ellipse cx="320" cy="180" rx="25" ry="12" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4"/>
            
            <!-- 코 가이드 -->
            <path d="M 250 180 L 250 240 M 235 245 C 245 255, 255 255, 265 245" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4"/>
            
            <!-- 입 가이드 -->
            <path d="M 210 300 C 230 320, 270 320, 290 300" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4"/>
            
            <!-- 머리카락 간단 윤곽 가이드 -->
            <path d="M 160 50 C 140 80, 120 130, 120 180 M 340 50 C 360 80, 380 130, 380 180" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4"/>
          </svg>

          <!-- 드로잉 캔버스 -->
          <canvas id="drawing-canvas"></canvas>
        </div>
      </div>

    </div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const canvas = document.getElementById("drawing-canvas");
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      const container = document.getElementById("canvas-container");
      
      let isDrawing = false;
      let currentColor = "#fca5a5";
      let currentLineWidth = 5;
      let isEraser = false;

      // 캔버스 크기를 CSS 컨테이너 크기에 맞추어 내부 해상도 설정
      function resizeCanvas() {
        const rect = container.getBoundingClientRect();
        // 고해상도 지원을 위해 기기 픽셀 비율 적용 (선명하게 그리기)
        const dpr = window.devicePixelRatio || 1;
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        
        // CSS 크기는 원래대로
        canvas.style.width = `${rect.width}px`;
        canvas.style.height = `${rect.height}px`;
        
        // 컨텍스트 스케일 조정
        ctx.scale(dpr, dpr);
        
        // 상태 초기화 방지용 설정 재적용
        updateContextState();
      }

      function updateContextState() {
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
      }

      window.addEventListener("resize", resizeCanvas);
      resizeCanvas(); // 초기 셋팅

      // 좌표 계산 함수 (마우스 및 터치 모두 지원)
      function getCoordinates(e) {
        const rect = canvas.getBoundingClientRect();
        let clientX = e.clientX;
        let clientY = e.clientY;

        if (e.touches && e.touches.length > 0) {
          clientX = e.touches[0].clientX;
          clientY = e.touches[0].clientY;
        }

        return {
          x: clientX - rect.left,
          y: clientY - rect.top
        };
      }

      // 그리기 시작
      function startPosition(e) {
        isDrawing = true;
        draw(e);
      }

      // 그리기 종료
      function endPosition() {
        isDrawing = false;
        ctx.beginPath(); // 경로 초기화 (다음 선이 이전 선과 이어지지 않게)
      }

      // 그리기 로직
      function draw(e) {
        if (!isDrawing) return;
        if (e.type.includes('touch')) e.preventDefault(); // 스크롤 방지

        const { x, y } = getCoordinates(e);

        ctx.lineWidth = currentLineWidth;
        
        if (isEraser) {
          // 지우개 모드: 그려진 픽셀을 투명하게 만듦
          ctx.globalCompositeOperation = "destination-out";
          ctx.strokeStyle = "rgba(0,0,0,1)"; // 색상은 무관
        } else {
          // 일반 그리기 모드
          ctx.globalCompositeOperation = "source-over";
          ctx.strokeStyle = currentColor;
        }

        ctx.lineTo(x, y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x, y);
      }

      // 이벤트 리스너 등록
      canvas.addEventListener("mousedown", startPosition);
      canvas.addEventListener("mouseup", endPosition);
      canvas.addEventListener("mousemove", draw);
      canvas.addEventListener("mouseleave", endPosition); // 캔버스 밖으로 나가면 종료

      canvas.addEventListener("touchstart", startPosition, { passive: false });
      canvas.addEventListener("touchend", endPosition);
      canvas.addEventListener("touchmove", draw, { passive: false });

      // 도구바 UI 인터랙션
      const colorBtns = document.querySelectorAll(".color-btn");
      const eraserBtn = document.getElementById("eraser-btn");
      const clearBtn = document.getElementById("clear-btn");
      const brushSize = document.getElementById("brush-size");

      // 색상 변경
      colorBtns.forEach(btn => {
        btn.addEventListener("click", (e) => {
          isEraser = false;
          currentColor = e.target.dataset.color;
          
          // UI 활성화 상태 표시
          colorBtns.forEach(b => {
            b.classList.remove("ring-2", "ring-offset-1", "ring-slate-300");
          });
          e.target.classList.add("ring-2", "ring-offset-1", "ring-slate-300");
          
          eraserBtn.classList.remove("bg-slate-200", "text-slate-800");
          eraserBtn.classList.add("text-slate-600");
        });
      });

      // 브러쉬 크기 변경
      brushSize.addEventListener("input", (e) => {
        currentLineWidth = e.target.value;
      });

      // 지우개 토글
      eraserBtn.addEventListener("click", () => {
        isEraser = true;
        
        // 색상 버튼 선택 해제
        colorBtns.forEach(b => {
          b.classList.remove("ring-2", "ring-offset-1", "ring-slate-300");
        });

        // 지우개 활성화 UI
        eraserBtn.classList.remove("text-slate-600");
        eraserBtn.classList.add("bg-slate-200", "text-slate-800");
      });

      // 전체 지우기
      clearBtn.addEventListener("click", () => {
        // 투명하게 전체 초기화 (배경 SVG는 보호됨)
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      });
    });
  </script>
</body>
</html>
