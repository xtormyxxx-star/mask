<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>'좋아요 흡혈귀'의 가짜 가면 해부하기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Pretendard', sans-serif; background-color: #E6F3FF; }
    .canvas-container { position: relative; width: 100%; max-width: 500px; aspect-ratio: 1/1; }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: crosshair; }
    #bg-canvas { z-index: 1; }
    #draw-canvas { z-index: 2; }
    input[type="text"] {
      width: 100%; padding: 8px 12px; margin-top: 4px; margin-bottom: 12px;
      border: 1px solid #ccc; border-radius: 6px; outline: none;
    }
    input[type="text"]:focus { border-color: #3B82F6; box-shadow: 0 0 0 2px rgba(59,130,246,0.2); }
    /* 기본 색상 버튼 호버 효과 */
    .color-swatch:hover { transform: scale(1.1); transition: transform 0.1s; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="max-w-6xl w-full bg-white rounded-3xl shadow-xl overflow-hidden flex flex-col md:flex-row" style="aspect-ratio: 16/9;">
    
    <!-- 좌측: 질문 영역 -->
    <div class="flex-1 p-8 md:p-12 flex flex-col justify-center bg-blue-50/50">
      <h1 class="text-3xl font-extrabold text-slate-800 mb-2">활동 1</h1>
      <h2 class="text-xl font-bold text-slate-600 mb-6">'좋아요 흡혈귀'의 가짜 가면 해부하기</h2>
      <p class="text-slate-700 leading-relaxed mb-8">
        최근 일주일 동안 디지털 기기를 사용하면서 기분이 가라앉거나 자존감이 떨어졌던 경험을 떠올려 봅니다.<br>
        아래 질문에 솔직하게 답한 후 가면에 색칠해보세요.
      </p>

      <div class="space-y-2 text-sm font-semibold text-slate-800">
        <div>
          <label for="q1">① 언제 그랬나요? (예: 학원 끝나고 밤에 침대에 누웠을 때)</label>
          <input type="text" id="q1" placeholder="답변을 입력하세요">
        </div>
        <div>
          <label for="q2">② 어떤 어플(앱)이었나요? (예: 인스타그램 릴스, 친구 부계정 스토리)</label>
          <input type="text" id="q2" placeholder="답변을 입력하세요">
        </div>
        <div>
          <label for="q3">③ 어떤 댓글이나 피드백, 혹은 영상 때문이었나요?</label>
          <input type="text" id="q3" placeholder="답변을 입력하세요">
        </div>
        <div>
          <label for="q4">④ 내가 온라인 공간에서 무심코 마주한 반응이 내 현실의 기분을 어떻게 흔들어 놓았나요?</label>
          <input type="text" id="q4" placeholder="답변을 입력하세요">
        </div>
      </div>

      <!-- 제출 버튼 문구 수정 -->
      <button id="submit-btn" class="mt-8 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-xl transition-all shadow-md active:scale-95">
        제출
      </button>
    </div>

    <!-- 우측: 그리기 영역 -->
    <div class="flex-1 p-8 flex flex-col items-center justify-center border-l border-slate-100">
      
      <!-- 그리기 도구 패널 -->
      <div class="flex flex-wrap gap-3 mb-6 bg-slate-100 p-3 rounded-2xl shadow-inner items-center w-full justify-between">
        
        <!-- 기본 색상 팔레트 추가 -->
        <div class="flex gap-1.5 items-center border-r border-slate-300 pr-3">
          <button class="color-swatch w-7 h-7 rounded-full border border-slate-300 shadow-sm" style="background-color: #000000;" data-color="#000000" title="검정"></button>
          <button class="color-swatch w-7 h-7 rounded-full border border-slate-300 shadow-sm" style="background-color: #EF4444;" data-color="#EF4444" title="빨강"></button>
          <button class="color-swatch w-7 h-7 rounded-full border border-slate-300 shadow-sm" style="background-color: #F59E0B;" data-color="#F59E0B" title="주황"></button>
          <button class="color-swatch w-7 h-7 rounded-full border border-slate-300 shadow-sm" style="background-color: #EAB308;" data-color="#EAB308" title="노랑"></button>
          <button class="color-swatch w-7 h-7 rounded-full border border-slate-300 shadow-sm" style="background-color: #22C55E;" data-color="#22C55E" title="초록"></button>
          <button class="color-swatch w-7 h-7 rounded-full border border-slate-300 shadow-sm" style="background-color: #3B82F6;" data-color="#3B82F6" title="파랑"></button>
          <button class="color-swatch w-7 h-7 rounded-full border border-slate-300 shadow-sm" style="background-color: #A855F7;" data-color="#A855F7" title="보라"></button>
          <button class="color-swatch w-7 h-7 rounded-full border border-slate-300 shadow-sm" style="background-color: #FFFFFF;" data-color="#FFFFFF" title="하양"></button>
        </div>

        <div class="flex gap-2 items-center">
          <input type="color" id="color-picker" value="#000000" class="w-8 h-8 rounded-full cursor-pointer overflow-hidden border-none p-0" title="사용자 지정 색상">
          <input type="range" id="brush-size" min="1" max="20" value="5" class="w-20 accent-blue-600">
        </div>

        <div class="flex gap-2 ml-auto">
          <button id="eraser-btn" class="px-3 py-1.5 bg-white text-slate-700 rounded-lg font-bold shadow-sm text-sm hover:bg-slate-50">지우개</button>
          <button id="clear-btn" class="px-3 py-1.5 bg-rose-50 text-rose-600 rounded-lg font-bold shadow-sm text-sm hover:bg-rose-100">전체 지우기</button>
        </div>
      </div>

      <!-- 캔버스 컨테이너 -->
      <div class="canvas-container bg-white shadow-sm border border-slate-200 rounded-2xl overflow-hidden">
        <canvas id="bg-canvas"></canvas>
        <canvas id="draw-canvas"></canvas>
      </div>
    </div>
  </div>

  <script>
    // --- 캔버스 및 그리기 설정 ---
    const bgCanvas = document.getElementById('bg-canvas');
    const drawCanvas = document.getElementById('draw-canvas');
    const bgCtx = bgCanvas.getContext('2d');
    const drawCtx = drawCanvas.getContext('2d');
    
    // 캔버스 크기 맞춤
    const resizeCanvas = () => {
      const container = document.querySelector('.canvas-container');
      const width = container.clientWidth;
      const height = container.clientHeight;
      
      [bgCanvas, drawCanvas].forEach(canvas => {
        canvas.width = width;
        canvas.height = height;
      });
      drawMaskBase(); // 리사이즈 시 마스크 다시 그리기
    };

    // 기본 마스크 가이드라인 그리기
    const drawMaskBase = () => {
      bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
      bgCtx.beginPath();
      // 머리 윤곽
      bgCtx.ellipse(bgCanvas.width/2, bgCanvas.height/2 - 20, bgCanvas.width/3, bgCanvas.height/2.5, 0, 0, Math.PI * 2);
      // 중앙 분할선 (점선)
      bgCtx.setLineDash([5, 5]);
      bgCtx.moveTo(bgCanvas.width/2, 20);
      bgCtx.lineTo(bgCanvas.width/2, bgCanvas.height - 20);
      
      bgCtx.strokeStyle = '#CBD5E1';
      bgCtx.lineWidth = 2;
      bgCtx.stroke();
      bgCtx.setLineDash([]);
      
      // 눈, 코, 입 가이드
      bgCtx.strokeStyle = '#E2E8F0';
      bgCtx.strokeRect(bgCanvas.width/2 - 80, bgCanvas.height/2 - 30, 40, 15); // 좌안
      bgCtx.strokeRect(bgCanvas.width/2 + 40, bgCanvas.height/2 - 30, 40, 15); // 우안
      bgCtx.beginPath(); bgCtx.arc(bgCanvas.width/2, bgCanvas.height/2 + 30, 10, 0, Math.PI); bgCtx.stroke(); // 코
      bgCtx.beginPath(); bgCtx.ellipse(bgCanvas.width/2, bgCanvas.height/2 + 80, 30, 10, 0, 0, Math.PI*2); bgCtx.stroke(); // 입
    };

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // 그리기 로직
    let isDrawing = false;
    let currentColor = '#000000';
    let isEraser = false;
    let lastX = 0, lastY = 0;

    const startDrawing = (e) => {
      isDrawing = true;
      const rect = drawCanvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      lastX = clientX - rect.left;
      lastY = clientY - rect.top;
    };

    const draw = (e) => {
      if (!isDrawing) return;
      e.preventDefault(); // 터치 스크롤 방지
      const rect = drawCanvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const x = clientX - rect.left;
      const y = clientY - rect.top;

      drawCtx.beginPath();
      drawCtx.moveTo(lastX, lastY);
      drawCtx.lineTo(x, y);
      
      drawCtx.lineCap = 'round';
      drawCtx.lineJoin = 'round';
      drawCtx.lineWidth = document.getElementById('brush-size').value;
      
      if (isEraser) {
        drawCtx.globalCompositeOperation = 'destination-out';
        drawCtx.strokeStyle = 'rgba(0,0,0,1)';
      } else {
        drawCtx.globalCompositeOperation = 'source-over';
        drawCtx.strokeStyle = currentColor;
      }
      
      drawCtx.stroke();
      lastX = x; lastY = y;
    };

    const stopDrawing = () => isDrawing = false;

    // 이벤트 리스너 (마우스 & 터치)
    drawCanvas.addEventListener('mousedown', startDrawing);
    drawCanvas.addEventListener('mousemove', draw);
    drawCanvas.addEventListener('mouseup', stopDrawing);
    drawCanvas.addEventListener('mouseout', stopDrawing);
    
    drawCanvas.addEventListener('touchstart', startDrawing, {passive: false});
    drawCanvas.addEventListener('touchmove', draw, {passive: false});
    drawCanvas.addEventListener('touchend', stopDrawing);

    // --- 도구 설정 (기본 팔레트 포함) ---
    const colorPicker = document.getElementById('color-picker');
    const eraserBtn = document.getElementById('eraser-btn');
    
    // 기본 색상 버튼 클릭 이벤트
    document.querySelectorAll('.color-swatch').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const selectedColor = e.target.getAttribute('data-color');
        currentColor = selectedColor;
        colorPicker.value = selectedColor; // 색상 선택기 값 동기화
        isEraser = false;
        eraserBtn.classList.remove('bg-slate-300');
      });
    });

    colorPicker.addEventListener('input', (e) => {
      currentColor = e.target.value;
      isEraser = false;
      eraserBtn.classList.remove('bg-slate-300');
    });
    
    eraserBtn.addEventListener('click', (e) => {
      isEraser = true;
      e.target.classList.add('bg-slate-300');
    });
    
    document.getElementById('clear-btn').addEventListener('click', () => {
      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
    });

    // --- 데이터 전송(제출) 로직 ---
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxzVWniSRgm7-cw3RRPyz8IDD313t7SgcuUXQ8vdY1pydL_kg3HAzoToQlq0Zxm0ZI/exec";

    document.getElementById('submit-btn').addEventListener('click', async () => {
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerText = "제출 중...";
      btn.classList.add('opacity-70');

      // 제출용 이미지 생성 (배경 가이드라인 + 학생 그림 병합)
      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = drawCanvas.width;
      exportCanvas.height = drawCanvas.height;
      const exportCtx = exportCanvas.getContext('2d');
      
      // 하얀 배경 깔기 (투명도 방지)
      exportCtx.fillStyle = '#FFFFFF';
      exportCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
      exportCtx.drawImage(bgCanvas, 0, 0);
      exportCtx.drawImage(drawCanvas, 0, 0);

      // 페이로드 데이터 구성
      const payload = {
        q1: document.getElementById('q1').value,
        q2: document.getElementById('q2').value,
        q3: document.getElementById('q3').value,
        q4: document.getElementById('q4').value,
        image: exportCanvas.toDataURL('image/png') // Base64 인코딩
      };

      try {
        // Apps Script로 POST 전송 (CORS 프리플라이트 우회를 위해 text/plain 사용)
        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8",
          },
          body: JSON.stringify(payload)
        });
        
        const result = await response.json();
        if(result.status === 'success') {
          alert('제출이 완료되었습니다.');
          // 폼 초기화
          ['q1', 'q2', 'q3', 'q4'].forEach(id => document.getElementById(id).value = '');
          drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
        } else {
          alert('제출 중 오류가 발생했습니다: ' + result.message);
        }
      } catch (error) {
        console.error('Error:', error);
        alert('네트워크 오류가 발생했습니다. 다시 시도해주세요.');
      } finally {
        btn.disabled = false;
        btn.innerText = "제출";
        btn.classList.remove('opacity-70');
      }
    });
  </script>
</body>
</html>
